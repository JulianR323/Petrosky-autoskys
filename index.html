<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Petrosky Autoski</title>
  <link rel="stylesheet" href="index.css">
</head>
<body>

  
  <header class="encabezado">
    <div class="logo">
      
      <img src="imagenes/logo.jpg" alt="Petrosky Autoski Logo">
      <span class="logo-texto">PETROSKY<br><small>AUTOSKI</small></span>
    </div>

    <div class="barra-busqueda">
      <span class="icono-buscar">&#128065;</span>
      <input type="text" id="campo-busqueda" placeholder="Buscar vehículos, marcas, modelos...">
    </div>

    <nav class="navegacion">
      <a href="#" class="enlace-nav">TALLERES</a>
      <a href="#" class="enlace-nav">VENDE/CAMBIA</a>
      <a href="#" class="enlace-nav">CONTÁCTANOS</a>
      <button class="boton-iniciar-sesion">INICIAR SESIÓN</button>
      <button class="boton-registrarse">REGISTRARSE</button>
    </nav>

    <div class="menu-hamburguesa">
      <span></span>
      <span></span>
      <span></span>
    </div>
  </header>

  
  <main class="contenido-principal">
    <h1 class="titulo-principal">COMPRA TU CARRO IDEAL</h1>

    
    <section class="galeria-autos">
      
      
      <div class="tarjeta-auto">
        <div class="marco-imagen">
          <img src="https://images.unsplash.com/photo-1544829099-b9a0c07fad1a?w=500" alt="Lamborghini">
        </div>
        <h3 class="nombre-auto">LAMBORGHINI</h3>
      </div>

      
      <div class="tarjeta-auto">
        <div class="marco-imagen">
          <img src="https://images.unsplash.com/photo-1617814076367-b759c7d7e738?w=500" alt="Hennessey Venom F5">
        </div>
        <h3 class="nombre-auto">HENNESSEY VENOM F5</h3>
      </div>

      
      <div class="tarjeta-auto">
        <div class="marco-imagen">
          <img src="https://images.unsplash.com/photo-1580273916550-e323be2ae537?w=500" alt="Bentley">
        </div>
        <h3 class="nombre-auto">BENTLEY</h3>
      </div>

      
      <div class="tarjeta-auto">
        <div class="marco-imagen">
          <img src="https://images.unsplash.com/photo-1503376780353-7e6692767b70?w=500" alt="Koenigsegg Jesko Absolut">
        </div>
        <h3 class="nombre-auto">KOENIGSEGG JESKO ABSOLUT</h3>
      </div>

    </section>

    
    <div class="contenedor-ver-mas">
      <button id="boton-ver-mas" class="boton-ver-mas">VER MÁS</button>
    </div>
  </main>

  
  <footer class="pie-pagina">
    <div class="info-derechos">
      <strong>Petrosky Autoski</strong>
      <p>© 2026 Petrosky Autoski</p>
    </div>
    <nav class="enlaces-pie">
      <a href="#">Talleres</a>
      <a href="#">Vende/Cambia</a>
      <a href="#">Bio</a>
      <a href="#">Contacto</a>
    </nav>
  </footer>

  <script src="index.js"></script>
</body>
</html>
